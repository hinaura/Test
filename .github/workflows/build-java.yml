# .github/workflows/build-java.yml
#
# Собирает ТОЛЬКО Java/Kotlin + packaging APK.
# NDK на этом раннере не устанавливается вообще.
# .so берутся:
#   - либо из artifact ЭТОГО ЖЕ workflow run (если запущен через
#     workflow_run после build-native.yml),
#   - либо из GitHub Release, опубликованного build-native.yml
#     (параметр native_tag / native_release_url).
#
# Верификация: скачанный .so-бандл ОБЯЗАТЕЛЬНО должен совпадать
# с sha256, который сам же build-native.yml посчитал и опубликовал —
# то есть источник бинарника всегда твой собственный CI, а не
# сторонний архив из интернета.

name: Build Telegram Java (APK)

on:
  workflow_dispatch:
    inputs:
      telegram_ref:
        description: "Telegram commit/tag/branch (должен соответствовать native_tag)"
        required: true
        default: "master"
      native_tag:
        description: "Release tag из build-native.yml, откуда брать .so (например native-<sha>)"
        required: true

  # Автозапуск сразу после успешной сборки нативки.
  workflow_run:
    workflows: ["Build Telegram Native (.so)"]
    types: [completed]

concurrency:
  group: build-java-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read   # нужно, чтобы скачать artifact из другого run (workflow_run)

jobs:
  build-java:
    name: Build Java-only APK
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_VERSION: "35"
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      # ------------------------------------------------------------
      # 1. Место на диске. NDK тут не ставим — самый большой
      #    источник веса на билд-раннере отсутствует по определению.
      # ------------------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-android: "false"   # SDK нужен, NDK просто не ставим отдельным шагом
          remove-docker-images: "true"

      # ------------------------------------------------------------
      # 2. Checkout Telegram (тот же ref, что был в build-native.yml).
      # ------------------------------------------------------------
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: ${{ inputs.telegram_ref || 'master' }}
          fetch-depth: 1
          submodules: false

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 \
            submodule update --init --recursive --depth=1

      # ------------------------------------------------------------
      # 3. Java / Gradle.
      # ------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Relocate Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          BIG_WORKSPACE="${GITHUB_WORKSPACE}/.ci"
          mkdir -p "$BIG_WORKSPACE/gradle-home" "$BIG_WORKSPACE/tmp"
          echo "GRADLE_USER_HOME=$BIG_WORKSPACE/gradle-home" >> "$GITHUB_ENV"
          echo "TMPDIR=$BIG_WORKSPACE/tmp" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. Переносим Android SDK на большой смонтированный том
      #    (по той же причине, что и в build-native.yml — по
      #    умолчанию SDK лежит вне $GITHUB_WORKSPACE).
      # ------------------------------------------------------------
      - name: Relocate Android SDK onto big volume
        shell: bash
        run: |
          set -euo pipefail

          OLD_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NEW_SDK="$GITHUB_WORKSPACE/.android-sdk"

          mkdir -p "$NEW_SDK"
          sudo rsync -a --remove-source-files "$OLD_SDK"/ "$NEW_SDK"/
          sudo rm -rf "$OLD_SDK"

          echo "ANDROID_HOME=$NEW_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$NEW_SDK" >> "$GITHUB_ENV"
          echo "$NEW_SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$NEW_SDK/platform-tools" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 5. Android SDK. NDK здесь НЕ устанавливается — сознательно.
      # ------------------------------------------------------------
      - name: Install Android SDK (no NDK)
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "platform-tools"

      # ------------------------------------------------------------
      # 5a. Путь А: этот workflow был триггернут через workflow_run
      #     сразу после build-native.yml — тянем artifact ИЗ ТОГО ЖЕ
      #     run без всякого скачивания по URL.
      # ------------------------------------------------------------
      - name: Download native artifact (workflow_run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: telegram-native-arm64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .ci/native

      # ------------------------------------------------------------
      # 5b. Путь Б: ручной запуск — берём .so из Release, который
      #     build-native.yml опубликовал в ЭТОМ ЖЕ репозитории.
      #     Никаких сторонних URL.
      # ------------------------------------------------------------
      - name: Download native release asset (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .ci/native
          cd .ci/native

          gh release download "${{ inputs.native_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "telegram-native-arm64.zip*"

      # ------------------------------------------------------------
      # 6. Проверяем sha256 (файл .sha256 тоже пришёл из своего же
      #    build-native.yml — не вводится вручную).
      # ------------------------------------------------------------
      - name: Verify native bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          cd .ci/native
          sha256sum -c telegram-native-arm64.zip.sha256

      # ------------------------------------------------------------
      # 7. Распаковываем в jni/ (НЕ jniLibs/!).
      #
      #    ВАЖНО: TMessagesProj/build.gradle содержит
      #      sourceSets.main.jniLibs.srcDirs = ['./jni/']
      #    то есть Gradle ищет prebuilt .so именно в jni/<abi>/,
      #    а не в стандартной папке jniLibs/<abi>/. Из-за этого
      #    предыдущая версия клала .so в игнорируемое место, и
      #    mergeDebugNativeLibs находил NO-SOURCE — в APK попадал
      #    только .so из сторонней AAR-зависимости (ML Kit), а не
      #    наш libtmessages.so.
      # ------------------------------------------------------------
      - name: Install prebuilt JNI libraries
        shell: bash
        run: |
          set -euo pipefail

          DEST="$GITHUB_WORKSPACE/TMessagesProj/jni"
          mkdir -p "$DEST"

          unzip -q ".ci/native/telegram-native-arm64.zip" -d "$DEST"

          echo "=== Native libraries ==="
          find "$DEST" -maxdepth 2 -type f -name "*.so" -print | sort

          COUNT="$(find "$DEST" -maxdepth 2 -type f -name "*.so" | wc -l)"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no .so files found"
            exit 1
          fi

      - name: Validate native libraries ABI
        shell: bash
        run: |
          set -euo pipefail
          ABI_DIR="$GITHUB_WORKSPACE/TMessagesProj/jni/arm64-v8a"

          if [ ! -d "$ABI_DIR" ]; then
            echo "ERROR: arm64-v8a directory is missing"
            exit 1
          fi

          find "$ABI_DIR" -maxdepth 1 -type f -name "*.so" -print0 |
            while IFS= read -r -d '' lib; do
              echo "----- $lib -----"
              file "$lib"
              if ! file "$lib" | grep -q "ARM aarch64"; then
                echo "ERROR: wrong architecture: $lib"
                exit 1
              fi
            done

      # ------------------------------------------------------------
      # 8. Только arm64-v8a в APK.
      #
      #    ВАЖНО: patch должен идти именно в TMessagesProj_App —
      #    там объявлен flavor "afat" с
      #      abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
      #    Патч TMessagesProj/build.gradle (библиотеки) НЕ влияет на
      #    финальную паковку APK — отсюда все 4 ABI-папки в готовом
      #    APK, даже когда мы сами собрали только arm64-v8a .so.
      # ------------------------------------------------------------
      - name: Restrict APK to arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/restrict_abi.py <<'PY'
          import re
          from pathlib import Path

          p = Path("TMessagesProj_App/build.gradle")
          text = p.read_text()

          # Заменяем ЛЮБОЙ abiFilters "..." , "..." (2-4 значения,
          # во всех product flavor блоках: afat, bundleAfat, и т.д.)
          # на единственный arm64-v8a.
          pattern = re.compile(r'abiFilters\s+((?:"[^"]+"\s*,\s*)*"[^"]+")')

          def repl(m):
              return 'abiFilters "arm64-v8a"'

          new_text, count = pattern.subn(repl, text)

          if count == 0:
              raise SystemExit(
                  "ERROR: no abiFilters entries found in TMessagesProj_App/build.gradle "
                  "-- Telegram's build script layout changed, update this step"
              )

          p.write_text(new_text)
          print(f"Restricted {count} abiFilters block(s) in TMessagesProj_App to arm64-v8a")
          PY
          python3 /tmp/restrict_abi.py

      # ------------------------------------------------------------
      # 9. google-services.json заглушка (как раньше).
      # ------------------------------------------------------------
      - name: Ensure google-services.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -f google-services.json ]; then
            echo "google-services.json already exists"
            exit 0
          fi

          python3 <<'PY'
          import json

          data = {
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "telegram-dummy",
                  "storage_bucket": "telegram-dummy.appspot.com"
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                          "android_client_info": {
                              "package_name": "org.telegram.messenger"
                          }
                      },
                      "oauth_client": [],
                      "api_key": [
                          {
                              "current_key": "AIzaSyDummy0000000000000000000000000000"
                          }
                      ],
                      "services": {
                          "appinvite_service": {
                              "other_platform_oauth_client": []
                          }
                      }
                  }
              ],
              "configuration_version": "1"
          }

          with open("google-services.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      # ------------------------------------------------------------
      # 10. Убеждаемся, что Gradle точно не пытается собирать
      #     нативный код на этом раннере (страховка от регрессий).
      # ------------------------------------------------------------
      - name: Show native configuration (sanity check)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Native-related Gradle settings ==="
          grep -RniE \
            "externalNativeBuild|ndkBuild|cmake|jniLibs|ndkVersion" \
            TMessagesProj build.gradle settings.gradle gradle.properties \
            2>/dev/null | head -n 300 || true

      # ------------------------------------------------------------
      # 11. Отключаем CMake как систему сборки нативки СОВСЕМ.
      #
      #     `-x externalNativeBuildDebug` не работает: AGP создаёт
      #     для CMake отдельные задачи configureCMakeDebug[abi] /
      #     buildCMakeDebug[abi][target], от которых mergeDebugNativeLibs
      #     зависит НАПРЯМУЮ, а не только через зонтичную задачу
      #     externalNativeBuildDebug. Исключение зонтичной задачи их не
      #     убирает — ubuntu-latest тащит preinstalled NDK (или AGP сам
      #     докачивает его через принятые на шаге 9 лицензии), поэтому
      #     Gradle тихо пересобирает нативку прямо здесь и подменяет
      #     проверенный prebuilt .so из jniLibs. Именно это и валило
      #     шаг "Confirm no native rebuild happened".
      #
      #     Вместо точечных -x (хрупко: имя buildCMakeDebug[...] зависит
      #     от ABI/target и versionCode) убираем сам блок
      #     android.externalNativeBuild.cmake.path в build.gradle —
      #     без него AGP вообще не регистрирует CMake-таски.
      # ------------------------------------------------------------
      - name: Disable native CMake build (use prebuilt .so only)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/disable_cmake.py <<'PY'
          import re
          from pathlib import Path

          p = Path("TMessagesProj/build.gradle")
          text = p.read_text()

          # Only the externalNativeBuild{cmake{...}} block that sets `path`
          # actually registers jni/CMakeLists.txt with AGP and causes
          # configureCMake*/buildCMake* tasks to be created. There is a
          # separate externalNativeBuild{cmake{version...; arguments...}}
          # block inside defaultConfig — that one is harmless without the
          # `path` block above and is left untouched.
          pattern = re.compile(
              r"externalNativeBuild\s*\{\s*cmake\s*\{\s*path[^}]*\}\s*\}\s*"
          )
          new_text, count = pattern.subn("", text, count=1)

          if count != 1:
              raise SystemExit(
                  "ERROR: could not find externalNativeBuild{cmake{path...}} "
                  "block in TMessagesProj/build.gradle -- Telegram's build "
                  "script layout changed, update this step"
              )

          p.write_text(new_text)
          print("Removed externalNativeBuild{cmake{path...}} block: "
                "AGP will not create any CMake tasks")
          PY
          python3 /tmp/disable_cmake.py

      # ------------------------------------------------------------
      # 12. Сборка APK — CMake-таски больше не существуют (см. шаг
      #     выше), так что пересборка нативки физически невозможна,
      #     -x тут больше не нужен и не нужна не-существующая задача.
      # ------------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :TMessagesProj_App:assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=2

      - name: Confirm no native rebuild happened
        shell: bash
        run: |
          set -euo pipefail
          # Belt-and-suspenders: with the externalNativeBuild{cmake{path...}}
          # block removed above, TMessagesProj/build/intermediates/cxx should
          # never even be created. Fail loudly if it somehow appears anyway,
          # instead of silently shipping a re-built .so.
          if [ -d TMessagesProj/build/intermediates/cxx ] && \
             find TMessagesProj/build/intermediates/cxx -name "*.so" -newer .ci/native/telegram-native-arm64.zip 2>/dev/null | grep -q .; then
            echo "ERROR: native code was rebuilt on this runner instead of using the prebuilt .so"
            exit 1
          fi
          echo "OK: no fresh native build artifacts found, prebuilt .so was used"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" -print

          APK="$(find TMessagesProj_App/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Using APK: $APK"
          du -h "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-arm64-debug
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
