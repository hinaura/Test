# GitHub Action: сборка Telegram Android из исходников (DrKLO/Telegram)
# Без сохранения изменений в репо - просто скачивает исходники и собирает APK.
#
# Запуск:
#   1) положи файл в .github/workflows/build-telegram.yml своего репозитория
#   2) push или workflow_dispatch
#   3) артефакт (APK) появится в Artifacts на странице запуска
#
# Важно:
#   - для рабочего аккаунта нужен свой api_id/api_hash (см. core.telegram.org/api/obtaining_api_id),
#     иначе используется dummy (id=4) из репо - годится только для теста сборки.
#   - Firebase google-services.json: репо требует его при сборке release.
#     Плейсхолдер генерируется автоматически (push-уведомления работать не будут).

name: Build Telegram Android

on:
  workflow_dispatch:          # ручной запуск из вкладки Actions
  push:
    branches: [ master ]

# отменяем предыдущий запуск этой же ветки, если идёт новый
concurrency:
  group: build-telegram-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest      # Ubuntu 24.04, есть Android SDK

    env:
      NDK_VERSION: "27.2.12479018"
      SDK_VERSION: "36"

    steps:
      # ---------------------------------------------------------------
      # 1. Расширяем дисковое пространство (сборка CMake+NDK большая).
      #    Должен идти ДО checkout: монтирует том поверх $GITHUB_WORKSPACE.
      #    НЕ удаляем android (иначе пропадёт SDK), удаляем dotnet/haskell/codeql/docker.
      # ---------------------------------------------------------------
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          # remove-android НЕ трогаем: он нужен для сборки

      # ---------------------------------------------------------------
      # 2. Скачиваем исходники Telegram с подмодулями
      # ---------------------------------------------------------------
      - name: Checkout Telegram sources
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: master
          # подмодули обязательны (C++ tgnet/ffmpeg/webrtc и т.д.)
          submodules: recursive
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 3. JDK 21 (AGP 8.10.1 требует Java 17+; Gradle 8.11.1 поддерж. 21)
      # ---------------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ---------------------------------------------------------------
      # 4. Кэш Gradle (ускоряет повторные запуски)
      # ---------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------------
      # 5. Готовим Android SDK: ставим нужные build-tools и NDK, принимаем лицензии      # ---------------------------------------------------------------
      - name: Install Android SDK platform & NDK
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $ANDROID_HOME" >&2
            # на ubuntu-latest обычно есть; если нет - упасть с понятной ошибкой
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" \
            "platforms;android-${SDK_VERSION}" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      # ---------------------------------------------------------------
      # 6. Только arm64-v8a (одна конкретная архитектура).
      #    Ограничиваем ABI и для prebuilt jniLibs, и для CMake,
      #    чтобы APK содержал только arm64 и сборка шла быстрее.
      # ---------------------------------------------------------------
      - name: Restrict build to arm64-v8a only
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          p = "TMessagesProj/build.gradle"
          s = open(p).read()
          if "abiFilters" not in s:
              marker = "        minSdkVersion 21"
              assert marker in s, "marker not found"
              s = s.replace(
                  marker,
                  marker + "\n\n        ndk {\n            abiFilters 'arm64-v8a'\n        }",
                  1,
              )
              open(p, "w").write(s)
              print("abiFilters added")
          else:
              print("abiFilters already present")
          PY
          # показываем результат для отладки
          grep -n "abiFilters\|ndk {" TMessagesProj/build.gradle || true

      # ---------------------------------------------------------------
      # 7. Google-services.json (нужен для сборки)
      #    Подставляем валидный плейсхолдер, если его нет.
      #    Замени на свой для реального использования.
      # ---------------------------------------------------------------
      - name: Ensure google-services.json placeholder
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -f TMessagesProj/google-services.json ]; then
            python3 - <<'PYEOF'
          import json
          data = {
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "telegram-dummy",
                  "storage_bucket": "telegram-dummy.appspot.com"
              },
              "client": [
                  {
                      "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                          "android_client_info": {"package_name": "org.telegram.messenger"}
                      },
                      "oauth_client": [],
                      "api_key": [{"current_key": "AIzaSyDummy0000000000000000000000000000"}],
                      "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                  }
              ],
              "configuration_version": "1"
          }
          with open("TMessagesProj/google-services.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF
            echo "Generated placeholder google-services.json"
          fi

      # ---------------------------------------------------------------
      # 8. Сборка. assembleDebug - без подписи/keystore (проще).
      #    Для release нужен свой keystore + Swap на assembleRelease.
      # ---------------------------------------------------------------
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :TMessagesProj:assembleDebug --stacktrace --no-daemon

      # ---------------------------------------------------------------
      # 9. Сохраняем APK как артефакт
      # ---------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APK
          path: |
            TMessagesProj/build/outputs/apk/tmessages/debug/*.apk
            TMessagesProj/build/outputs/apk/*/debug/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: warn
